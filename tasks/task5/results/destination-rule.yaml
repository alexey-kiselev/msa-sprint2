apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: booking-service
  namespace: default
spec:
  host: booking-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 2s
      http:
        http1MaxPendingRequests: 32
        http2MaxRequests: 64
        maxRequestsPerConnection: 8
        maxRetries: 8
    outlierDetection:
      consecutive5xxErrors: 2
      consecutiveGatewayErrors: 2
      interval: 5s
      baseEjectionTime: 15s
      maxEjectionPercent: 100
      minHealthPercent: 0
  subsets:
    - name: v1
      labels:
        version: v1
      trafficPolicy:
        connectionPool:
          http:
            maxRetries: 8
        outlierDetection:
          consecutive5xxErrors: 1
          consecutiveGatewayErrors: 1
          interval: 2s
          baseEjectionTime: 10s
          maxEjectionPercent: 100
          minHealthPercent: 0
    - name: v2
      labels:
        version: v2
      trafficPolicy:
        connectionPool:
          http:
            maxRetries: 8
        outlierDetection:
          consecutive5xxErrors: 3
          interval: 5s
          baseEjectionTime: 30s
          maxEjectionPercent: 50
          minHealthPercent: 0
