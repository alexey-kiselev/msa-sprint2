stages:
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service

build:
  stage: build
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} ./booking-service

unit-test:
  stage: test
  image: golang:1.22-alpine
  script:
    - cd booking-service
    - go test ./...

test:
  stage: test
  needs:
    - job: build
  script:
    - docker rm -f booking-service-test || true
    - docker run -d --name booking-service-test -e ENABLE_FEATURE_X=true -p 18080:8080 ${IMAGE_NAME}:${IMAGE_TAG}
    - |
      ok=0
      for i in $(seq 1 30); do
        if curl -fsS http://127.0.0.1:18080/ping | grep -qx pong; then
          ok=1
          break
        fi
        sleep 1
      done
      test "$ok" = "1"
    - curl -fsS http://127.0.0.1:18080/health
    - curl -fsS http://127.0.0.1:18080/ready
    - curl -fsS http://127.0.0.1:18080/feature | grep -q "Feature X"
    - docker rm -f booking-service-test

deploy:
  stage: deploy
  needs:
    - job: test
  script:
    - minikube image load ${IMAGE_NAME}:${IMAGE_TAG}
    - helm upgrade --install booking-service ./helm/booking-service -f ./helm/booking-service/values.yaml --wait --timeout 2m
    - kubectl rollout status deployment/booking-service --timeout=120s

tag:
  stage: tag
  needs:
    - job: deploy
  script:
    - |
      TAG="task4-$(date +%Y%m%d%H%M%S)"
      git tag "${TAG}"
      echo "Created git tag ${TAG}"
